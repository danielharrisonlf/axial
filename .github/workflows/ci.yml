name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axial
          POSTGRES_PASSWORD: axial_ci_only
          POSTGRES_DB: axial_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axial -d axial_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://axial:axial_ci_only@localhost:5432/axial_test?schema=projects
      TEST_DATABASE_URL: postgresql://axial:axial_ci_only@localhost:5432/axial_test?schema=projects
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm --filter @axial/web exec playwright install --with-deps chromium
      - run: pnpm test:web:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-acceptance-evidence
          path: output/validation/web
