# Workspace (React, rotas por hash: tudo cai no index.html)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # arquivos com hash no nome: cache de um ano
  location /assets/ {
    include /etc/nginx/snippets/security-headers.inc;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index e arquivos sem hash (ícones, theme.js): sempre revalidados
  location / {
    include /etc/nginx/snippets/security-headers.inc;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
