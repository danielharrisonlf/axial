# Insights (remote do Module Federation): carregado pelo Workspace a partir de outro domínio,
# por isso todas as respostas levam CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /assets/ {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # remoteEntry.js e manifestos mudam a cada deploy: sempre revalidados
  location / {
    include /etc/nginx/snippets/security-headers.inc;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
