name: axial
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axial_local_only}
      POSTGRES_DB: axial_dev
    ports: ["127.0.0.1:5549:5432"]
    volumes: ["axial-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axial -d axial_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axial
      POSTGRES_PASSWORD: axial_local_only
      POSTGRES_DB: axial_test
    ports: ["127.0.0.1:5550:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axial -d axial_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6389:6379"]
    volumes: ["axial-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  axial-postgres:
  axial-redis:
